# ==========================================
# MODO OSCURO (Minimalista B&W / Dracula)
# ==========================================
set -g status-style bg=default,fg=white
set -g status-left "[#S] "
set -g status-left-style fg=white,bold
set -g status-right " #(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)% │ %Y-%m-%d │ %H:%M "
set -g status-right-style fg=white
set -g window-status-format " #I:#W "
set -g window-status-style fg=gray
set -g window-status-current-format " [#I:#W] "
set -g window-status-current-style fg=white,bold
set -g pane-border-style fg="#444444"
set -g pane-active-border-style fg=white
