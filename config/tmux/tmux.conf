# ==========================================
# TMUX CONFIGURATION (Ultra-Minimalist B&W + Vim-Tmux-Navigator)
# Location: ~/.config/tmux/tmux.conf
# ==========================================

# 1. Compatibilidad de colores de la terminal
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:Tc"

# 2. Habilitar mouse (scroll y redimensionamiento)
set -g mouse on

# 3. La numeración de ventanas/paneles inicia en 1
set -g base-index 1
setw -g pane-base-index 1

# 4. Atajos sencillos para dividir pantallas
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 5. Navegación fluida e integrada entre Tmux, Neovim y vi-sql usando Ctrl+h/j/k/l (Sin presionar Ctrl+b)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|vi-sql)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Permitir limpiar la pantalla con Ctrl+b seguido de Ctrl+l (ya que Ctrl+l directo ahora cambia de panel)
bind C-l send-keys C-l

# Habilitar modo vi para el buffer de copia (Scroll nativo con Ctrl+b y luego [)
setw -g mode-keys vi

# Mantener también la navegación manual tras Ctrl+b
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 5.6. Cambiar de ventana con Alt + Número (sin prefijo)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# 6. Recarga rápida de configuración (Ctrl+b y luego r)
bind r source-file ~/.config/tmux/tmux.conf \; display "¡Configuración recargada!"

# ==========================================
# ESTILO Y TEMA (Modo Claro / Modo Oscuro)
# ==========================================
set -g status-position top
set -g status-justify left
set -g status-interval 5

# Cargar tema activo (claro u oscuro)
source-file ~/.config/tmux/current-theme.conf

# Atajo rápido para alternar tema: Prefix (Ctrl+b) + Shift+T
bind T run-shell "toggle-theme"

# Habilitar teclas extendidas para soporte de terminales modernas y TUI
set -g extended-keys on
set -g extended-keys-format csi-u

# para la nota rapida encima de mi pantalla control b luego n
