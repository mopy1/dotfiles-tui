# ==========================================
# MODO CLARO (Minimalista / Blanco Neutro)
# ==========================================
set -g status-style bg=default,fg="#111827"
set -g status-left "[#S] "
set -g status-left-style fg="#111827",bold
set -g status-right " #(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)% │ %Y-%m-%d │ %H:%M "
set -g status-right-style fg="#111827"
set -g window-status-format " #I:#W "
set -g window-status-style fg="#6b7280"
set -g window-status-current-format " [#I:#W] "
set -g window-status-current-style fg="#111827",bold
set -g pane-border-style fg="#e5e7eb"
set -g pane-active-border-style fg="#111827"
