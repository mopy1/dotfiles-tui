# ─── tmux config ────────────────────────────────────────────────────────────

# Prefix: Ctrl+b (default tmux)
set -g prefix C-b
bind C-b send-prefix

# Calidad de vida
set -g mouse on
set -sg escape-time 0
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1

# ─── Nota Rápida ─────────────────────────────────────────────────────────────
# Prefix + n  →  abre / oculta popup flotante persistente (nvim siempre cargado en segundo plano)
bind n if-shell -F '#{==:#{session_name},nota-rapida}' {
    detach-client
} {
    display-popup -w 85% -h 85% -E "tmux-nota-rapida"
}

# ─── Terminal Flotante ────────────────────────────────────────────────────────
# Prefix + t  →  abre / oculta popup flotante con terminal persistente (reemplaza el reloj)
bind t if-shell -F '#{==:#{session_name},terminal-flotante}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "tmux-scratch-terminal '#{pane_current_path}'"
}

# ─── Tema & Alternancia de Tema (Prefix + T) ─────────────────────────────────
if-shell '[ -f ~/.config/tmux/current-theme.conf ]' 'source-file ~/.config/tmux/current-theme.conf'
bind T run-shell "toggle-theme"

